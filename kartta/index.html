// ---------- koordinaatit: WGS84 <-> ETRS-TM35FIN (EPSG:3067), Krüger 4. kertaluku
const TM={a:6378137,f:1/298.257222101,k0:0.9996,lon0:27*Math.PI/180,E0:500000};
(function(){const f=TM.f,n=f/(2-f);TM.n=n;TM.A=TM.a/(1+n)*(1+n*n/4+n**4/64);TM.e=Math.sqrt(2*f-f*f);

 TM.be=[n/2-2*n*n/3+37*n**3/96-n**4/360,n*n/48+n**3/15-437*n**4/1440,17*n**3/480-37*n**4/840,4397*n**4/161280];
 TM.de=[2*n-2*n*n/3-2*n**3+116*n**4/45,7*n*n/3-8*n**3/5-227*n**4/45,56*n**3/15-136*n**4/35,4279*n**4/630]})();
function wgs2tm(lat,lon){const phi=lat*Math.PI/180,lam=lon*Math.PI/180-TM.lon0,e=TM.e;
 const t=Math.sinh(Math.atanh(Math.sin(phi))-e*Math.atanh(e*Math.sin(phi)));
 const xi_=Math.atan2(t,Math.cos(lam)),eta_=Math.atanh(Math.sin(lam)/Math.sqrt(1+t*t));let xi=xi_,eta=eta_;
 for(let j=1;j<=4;j++){xi+=TM.al[j-1]*Math.sin(2*j*xi_)*Math.cosh(2*j*eta_);eta+=TM.al[j-1]*Math.cos(2*j*xi_)*Math.sinh(2*j*eta_)}
 return{E:TM.E0+TM.k0*TM.A*eta,N:TM.k0*TM.A*xi}}
function tm2wgs(E,N){const xi=N/(TM.k0*TM.A),eta=(E-TM.E0)/(TM.k0*TM.A);let xi_=xi,eta_=eta;
 for(let j=1;j<=4;j++){xi_-=TM.be[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);eta_-=TM.be[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*eta)}
 const chi=Math.asin(Math.sin(xi_)/Math.cosh(eta_));let phi=chi;for(let j=1;j<=4;j++)phi+=TM.de[j-1]*Math.sin(2*j*chi);
 const lam=Math.atan2(Math.sinh(eta_),Math.cos(xi_));return{lat:phi*180/Math.PI,lon:(lam+TM.lon0)*180/Math.PI}}

function calCompute(c){if(!c||!c.pts||!c.pts.length)return null;const P=c.pts;
 if(P.length===1){const p=P[0];return{n:1,rot:0,rc:[p.rE,p.rN],kc:[p.kE,p.kN],shift:Math.hypot(p.kE-p.rE,p.kN-p.rN),res:0}}
 const rc=[0,0],kc=[0,0];P.forEach(p=>{rc[0]+=p.rE/P.length;rc[1]+=p.rN/P.length;kc[0]+=p.kE/P.length;kc[1]+=p.kN/P.length});
 let sc=0,ss=0;P.forEach(p=>{const ax=p.rE-rc[0],ay=p.rN-rc[1],bx=p.kE-kc[0],by=p.kN-kc[1];sc+=ax*bx+ay*by;ss+=ax*by-ay*bx});
 const rot=Math.atan2(ss,sc);const o={n:P.length,rot,rc,kc};let r2=0;P.forEach(p=>{const q=calApplyO(o,p.rE,p.rN);r2+=(q.E-p.kE)**2+(q.N-p.kN)**2});o.res=Math.sqrt(r2/P.length);
 o.shift=Math.hypot(kc[0]-rc[0],kc[1]-rc[1]);
 const dr=Math.hypot(P[0].rE-P[1].rE,P[0].rN-P[1].rN),dk=Math.hypot(P[0].kE-P[1].kE,P[0].kN-P[1].kN);o.scaleErr=dr-dk;return o}
function calApplyO(o,E,N){const c=Math.cos(o.rot),s=Math.sin(o.rot),x=E-o.rc[0],y=N-o.rc[1];return{E:o.kc[0]+c*x-s*y,N:o.kc[1]+s*x+c*y}}

function average(sec,minN,onTick){return new Promise((res,rej)=>{if(!gpsStart()){rej(new Error("GPS ei käytettävissä"));return}
 const A=[];const t0=Date.now();const f=r=>{A.push(r)};SAMPLERS.push(f); // vain painalluksen jälkeen saapuneet havainnot
 const iv=setInterval(()=>{const el=(Date.now()-t0)/1000;onTick&&onTick(el,A.length);
  if((el>=sec&&A.length>=minN)||el>=sec*3){clearInterval(iv);SAMPLERS=SAMPLERS.filter(x=>x!==f);
   if(!A.length){if(RAW&&Date.now()-RAW.t<5000)A.push(RAW);else{rej(new Error("Ei GPS-havaintoja – onko sijainti sallittu?"));return}}let sw=0,e=0,n=0,am=0;A.forEach(r=>{const w=1/Math.max(r.acc,1)**2;sw+=w;e+=r.E*w;n+=r.N*w;am+=r.acc});
   e/=sw;n/=sw;let sd=0;A.forEach(r=>sd+=(r.E-e)**2+(r.N-n)**2);res({E:e,N:n,n:A.length,acc:am/A.length,sd:Math.sqrt(sd/A.length),t:Date.now()})}},250);
 MODAL_CANCEL=()=>{clearInterval(iv);SAMPLERS=SAMPLERS.filter(x=>x!==f);rej(new Error("peruttu"))}})}
