<!doctype html><html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tontti 4 – paritalo, 3D-malli – VERSIO B HD (pöytäkoneille: valokartat, aurinko, vuodenajat)</title><meta name="tontti4-versio" content="versio-b-hd">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9fc2e6;font-family:system-ui,sans-serif}
#bar{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
#bar button{border:0;border-radius:6px;padding:8px 11px;background:rgba(20,22,26,.78);color:#fff;font-size:14px;cursor:pointer}
#bar button.tg{background:rgba(120,30,30,.8)}
#bar button.in{background:rgba(150,110,50,.85)}
#pad{position:fixed;right:14px;bottom:52px;display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;z-index:3;touch-action:none}
#pad button{border:0;border-radius:10px;background:rgba(20,22,26,.7);color:#fff;font-size:22px;touch-action:none;user-select:none}
#info{position:fixed;bottom:8px;left:8px;right:8px;color:#fff;background:rgba(0,0,0,.45);padding:6px 9px;border-radius:6px;font-size:13px;z-index:2}
canvas{display:block}
#bar button.pano{background:rgba(30,90,70,.85)}
#bar button.pano.on{outline:2px solid #9fe}
#pano{display:none;position:fixed;inset:0;z-index:20;background:transparent;touch-action:none;cursor:grab}
#pano.show{display:block}
#pano:active{cursor:grabbing}
#pano-ui{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:2;pointer-events:none}
#pano-ui > *{pointer-events:auto}
#pano-title{color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:6px;font-size:15px;font-weight:600}
#pano-links{display:flex;flex-wrap:wrap;gap:5px}
#pano-links button,#pano-close{border:0;border-radius:6px;padding:7px 10px;background:rgba(20,22,26,.78);color:#fff;font-size:13px;cursor:pointer}
#pano-links button.on{background:rgba(30,110,80,.9)}
#pano-close{margin-left:auto;background:rgba(120,30,30,.85)}
#pano-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none}
#pmenu-wrap{position:relative;display:inline-block}
#pmenu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:5;background:rgba(18,20,24,.94);border-radius:8px;padding:8px;width:min(92vw,560px);max-height:75vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.45);grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
#pmenu.open{display:grid}
#pmenu .pm-head{grid-column:1/-1;color:#cfe;font-size:13px;padding:2px 4px 4px}
#pmenu .pm-item{display:flex;flex-direction:column;align-items:stretch;gap:3px;border:0;border-radius:6px;padding:5px;background:rgba(255,255,255,.07);color:#fff;cursor:pointer;text-align:left}
#pmenu .pm-item:hover{background:rgba(30,110,80,.75)}
#pmenu .pm-item img{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:4px;display:block}
#pmenu .pm-t{font-size:14px;font-weight:600}
#pmenu .pm-d{font-size:11.5px;opacity:.8;line-height:1.25}
#sunui{position:fixed;left:8px;bottom:44px;z-index:4;width:min(440px,94vw);background:rgba(16,18,22,.86);color:#eee;border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#sunui .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:3px 0}
#sunui input[type=range]{width:100%}
#sunui button,#sunui select,#sunui input[type=date]{border:0;border-radius:5px;padding:4px 7px;background:#2b3038;color:#fff;font-size:12.5px;cursor:pointer}
#sunui .presets button{background:#3a3424}
#sunui .note{margin-left:auto;font-size:11px;color:#9cd}
#sunui .dim{color:#aab;font-size:12px}
#sunui.min .body{display:none}
#su-min{padding:2px 8px!important}
#pbar{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:30;width:min(520px,86vw);background:rgba(10,12,16,.82);color:#fff;border-radius:10px;padding:14px 16px;font-size:14px;text-align:center}
#pbar .tr{height:10px;background:#333;border-radius:5px;overflow:hidden;margin-top:9px}
#pfill{height:100%;width:0;background:linear-gradient(90deg,#6c9,#9de);transition:width .25s}
#pbar small{display:block;margin-top:8px;color:#9cd}
#mobwarn{position:fixed;top:30%;left:6%;right:6%;z-index:40;background:#fff;color:#222;padding:14px;border-radius:10px;font-size:15px;box-shadow:0 6px 30px rgba(0,0,0,.5)}
</style></head><body>
<div id="bar"></div><div id="pad"><button data-k="ArrowLeft">⟲</button><button data-k="KeyW">▲</button><button data-k="ArrowRight">⟳</button><button data-k="KeyA">◀</button><button data-k="KeyS">▼</button><button data-k="KeyD">▶</button></div><div id="info">Ladataan HD-mallia…</div><div id="pbar"><div id="ptxt">Ladataan HD-mallia…</div><div class="tr"><div id="pfill"></div></div><small>HD-versio on tarkoitettu pöytäkoneille (iso lataus, raskas grafiikka). Puhelimelle: <a href="../versio-b/" style="color:#9de">kevyt versio B</a></small></div>
